<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Validación del Certificado · Sistema GOBES-eIDAS</title>
  <link rel="stylesheet" href="style.css">

  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>

<body>

<header class="top-banner">
  <div class="banner-title">
    Clínica Clara del Rey · Madrid · ES<br>
    SISTEMA GOB·ES · FNMT @firma · Cl@ve · Autofirma · eIDAS
  </div>
  <div id="realtime"></div>
</header>

<main class="container">

  <h1>Validando documento…</h1>
  <h2>Conectando con servidores seguros GOBES-eIDAS</h2>

  <div class="animation-box">
    <lottie-player 
      src="validate.lottie" 
      background="transparent"
      speed="1"
      style="width:240px;height:240px;margin:auto;"
      loop autoplay>
    </lottie-player>
  </div>

  <div id="status-box" class="status-box">
    <p id="status-line">Inicializando validación…</p>
  </div>

</main>

<footer>
  © Gobierno de España · Ministerio de Sanidad · Sistema GOBES-eIDAS
</footer>

<script src="script.js"></script>

</body>
</html>
