<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sistema GOBES•eIDAS – Módulo de Validación</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="loader">
  <h1>Validando integridad…</h1>
  <img src="loader.gif" class="loader-gif">
</div>

<main id="content" aria-hidden="true">
  <h1>Sistema GOBES•eIDAS</h1>
  <p>Módulo principal de validación del documento.</p>
</main>

<footer>
  <div>Online real-time connected</div>
  <div class="online-indicator"></div>
  <div>© Sistema de GOBES•eIDAS</div>
</footer>

<script>
window.addEventListener('load', function(){
  setTimeout(function(){
    const loader = document.getElementById('loader');
    const content = document.getElementById('content');
    loader.style.opacity = '0';
    setTimeout(function(){
      loader.style.display = 'none';
      content.style.opacity = '1';
      content.setAttribute('aria-hidden','false');
    }, 900);
  }, 11000);
});
</script>

</body>
</html>
